<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=20260508">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="dashboard" class="dashboard">

    <!-- Clock Widget -->
    <div class="widget" id="widget-clock" data-widget="clock">
      <button class="fullscreen-btn" aria-label="Toggle fullscreen">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7"/>
        </svg>
      </button>
      <div class="widget-content clock-content">
        <div class="clock-time" id="clock-time"></div>
        <div class="clock-seconds" id="clock-seconds"></div>
        <div class="clock-date" id="clock-date"></div>
        <div class="clock-greeting" id="clock-greeting"></div>
      </div>
    </div>

    <!-- Photos Widget -->
    <div class="widget" id="widget-photos" data-widget="photos">
      <button class="fullscreen-btn" aria-label="Toggle fullscreen">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7"/>
        </svg>
      </button>
      <div class="widget-content photos-content">
        <div class="photo-container" id="photo-container">
          <div class="photo-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <p>Add photos to the <code>photos/</code> folder</p>
          </div>
        </div>
        <div class="photo-dots" id="photo-dots"></div>
      </div>
    </div>

    <!-- MTA Widget -->
    <div class="widget" id="widget-mta" data-widget="mta">
      <button class="fullscreen-btn" aria-label="Toggle fullscreen">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7"/>
        </svg>
      </button>
      <div class="widget-content mta-content">
        <div class="mta-header">
          <h2>MTA Departures</h2>
          <span class="mta-updated" id="mta-updated"></span>
        </div>
        <div class="mta-alerts" id="mta-alerts"></div>
        <div class="mta-stations" id="mta-stations"></div>
      </div>
    </div>

    <!-- Apps Widget -->
    <div class="widget" id="widget-apps" data-widget="apps">
      <div class="widget-content apps-content">
        <div class="apps-grid">
          <button class="app-icon" data-app="weather">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span>Weather</span>
          </button>
          <button class="app-icon" data-app="todos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
            <span>To-Do</span>
          </button>
          <button class="app-icon" data-app="calendar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            <span>Calendar</span>
          </button>
          <button class="app-icon" data-app="recipes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
            </svg>
            <span>Recipes</span>
          </button>
          <button class="app-icon" data-app="youtube">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
            </svg>
            <span>YouTube</span>
          </button>
          <button class="app-icon" data-app="notes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
            </svg>
            <span>Notes</span>
          </button>
          <button class="app-icon" data-app="timer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <circle cx="12" cy="13" r="9"/><path d="M12 9v4l2 2"/><path d="M9 1h6"/><path d="M12 1v3"/>
            </svg>
            <span>Timer</span>
          </button>
          <button class="app-icon" data-app="pomodoro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 4"/>
            </svg>
            <span>Pomodoro</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Browser Fullscreen Button (hides URL bar) -->
  <button id="browser-fullscreen-btn" class="browser-fullscreen-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
      <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
    </svg>
    <span>Fullscreen</span>
  </button>

  <!-- Weather overlay (hidden by default) -->
  <div id="weather-overlay" class="weather-overlay hidden">
    <button class="overlay-back-btn" data-close="weather-overlay">&larr; Back</button>
    <div class="weather-display" id="weather-display"></div>
  </div>

  <!-- To-Do overlay (hidden by default) -->
  <div id="todos-overlay" class="todos-overlay hidden">
    <button class="overlay-back-btn" data-close="todos-overlay">&larr; Back</button>
    <div class="todos-display" id="todos-display"></div>
  </div>

  <!-- Calendar overlay (hidden by default) -->
  <div id="calendar-overlay" class="calendar-overlay hidden">
    <button class="overlay-back-btn" data-close="calendar-overlay">&larr; Back</button>
    <div class="calendar-display" id="calendar-display"></div>
  </div>

  <!-- Timer overlay (hidden by default) -->
  <div id="timer-overlay" class="timer-overlay hidden">
    <button class="overlay-back-btn" data-close="timer-overlay">&larr; Back</button>
    <div class="timer-display" id="timer-display"></div>
  </div>

  <!-- Pomodoro overlay (hidden by default) -->
  <div id="pomodoro-overlay" class="pomodoro-overlay hidden">
    <button class="overlay-back-btn" data-close="pomodoro-overlay">&larr; Back</button>
    <div class="pomodoro-split">
      <div class="pomodoro-display" id="pomodoro-display"></div>
      <div class="pomodoro-todos" id="pomodoro-todos"></div>
    </div>
  </div>

  <!-- Notes overlay (hidden by default) -->
  <div id="notes-overlay" class="notes-overlay hidden">
    <button class="overlay-back-btn" data-close="notes-overlay">&larr; Back</button>
    <div class="notes-display" id="notes-display"></div>
  </div>

  <!-- YouTube overlay (hidden by default) -->
  <div id="youtube-overlay" class="youtube-overlay hidden">
    <button class="overlay-back-btn" data-close="youtube-overlay">&larr; Back</button>
    <div id="youtube-container"></div>
  </div>

  <!-- Recipe overlay (hidden by default) -->
  <div id="recipe-overlay" class="recipe-overlay hidden">
    <button class="overlay-back-btn" data-close="recipe-overlay">&larr; Back</button>
    <div id="recipe-container"></div>
  </div>

  <!-- Alarm overlay (hidden by default) -->
  <div id="alarm-overlay" class="alarm-overlay hidden">
    <div class="alarm-content">
      <div class="alarm-icon">ALARM</div>
      <div class="alarm-time" id="alarm-display-time"></div>
      <div class="alarm-dismiss-hint">Tap anywhere to dismiss</div>
    </div>
  </div>

  <!-- Sleep overlay (hidden by default) -->
  <div id="sleep-overlay" class="sleep-overlay hidden"></div>

  <script src="config.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-listener.js"></script>
</body>
</html>
