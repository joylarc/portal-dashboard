<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Remote">
  <title>Portal Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-card-active: #252545;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --text-muted: #555577;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --green: #4ade80;
      --red: #ef4444;
      --border: #2a2a44;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .remote {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 0.75rem;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }

    .status-dot.connected { background: var(--green); }

    /* Sections */
    .section {
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* Widget Switcher */
    .widget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .widget-btn {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 16px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .widget-btn:active {
      transform: scale(0.96);
    }

    .widget-btn.active {
      border-color: var(--accent);
      background: var(--bg-card-active);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .widget-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-dim);
      transition: stroke 0.2s;
    }

    .widget-btn.active svg {
      stroke: var(--accent);
    }

    /* Show All button */
    .show-all-btn {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .show-all-btn:active {
      transform: scale(0.98);
    }

    .show-all-btn.active {
      border-color: var(--accent);
      background: var(--bg-card-active);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* URL Input (for YouTube, etc.) */
    .url-input-group {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: var(--accent);
    }

    .url-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      color: white;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:active {
      opacity: 0.8;
    }

    /* Quick Actions */
    .action-row {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      transform: scale(0.96);
      background: var(--bg-card-active);
    }

    /* Alarm */
    .alarm-set-row {
      display: flex;
      gap: 8px;
    }

    .time-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      -webkit-appearance: none;
    }

    .time-input:focus {
      border-color: var(--accent);
    }

    .alarm-list {
      margin-top: 8px;
    }

    .alarm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
    }

    .alarm-item-time {
      font-size: 1rem;
      font-weight: 500;
    }

    .alarm-delete {
      background: none;
      border: none;
      color: var(--red);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Notes */
    .notes-toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .toolbar-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .toolbar-btn:active {
      background: var(--bg-card-active);
    }

    .color-swatch {
      border-radius: 50%;
      width: 26px;
      height: 26px;
      border: 2px solid transparent;
    }

    .color-swatch.selected {
      border-color: var(--text);
    }

    .notes-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      -webkit-appearance: none;
    }

    .notes-input:focus {
      border-color: var(--accent);
    }

    .notes-input::placeholder {
      color: var(--text-muted);
    }

    /* Recipes */
    .recipe-list {
      max-height: 250px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .recipe-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: block;
      border: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
    }

    .recipe-item:active {
      background: var(--bg-card-active);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card-active);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text);
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="remote">
    <div class="header">
      <h1>Portal Remote</h1>
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>

    <!-- Widget Switcher -->
    <div class="section">
      <div class="section-label">Display</div>
      <div class="widget-grid">
        <button class="widget-btn" data-widget="clock" id="btn-clock">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Clock
        </button>
        <button class="widget-btn" data-widget="photos" id="btn-photos">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          Photos
        </button>
        <button class="widget-btn" data-widget="mta" id="btn-mta">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          MTA
        </button>
        <button class="widget-btn" data-widget="calendar" id="btn-calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          Calendar
        </button>
      </div>
      <button class="show-all-btn active" id="btn-showall">Show All Widgets</button>
    </div>

    <!-- Notes -->
    <div class="section">
      <div class="section-label">Notes</div>
      <div class="notes-toolbar">
        <button class="toolbar-btn" id="notes-bullet" title="Add bullet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="4" cy="6" r="1.5" fill="currentColor"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <button class="toolbar-btn color-swatch" data-color="white" style="background:#e8e8f0;" title="White"></button>
        <button class="toolbar-btn color-swatch" data-color="red" style="background:#ef4444;" title="Red"></button>
        <button class="toolbar-btn color-swatch" data-color="green" style="background:#4ade80;" title="Green"></button>
        <button class="toolbar-btn color-swatch" data-color="blue" style="background:#60a5fa;" title="Blue"></button>
        <button class="toolbar-btn color-swatch" data-color="yellow" style="background:#fbbf24;" title="Yellow"></button>
        <button class="toolbar-btn color-swatch" data-color="purple" style="background:#a78bfa;" title="Purple"></button>
        <button class="toolbar-btn color-swatch" data-color="orange" style="background:#fb923c;" title="Orange"></button>
      </div>
      <textarea class="notes-input" id="notes-input" rows="5" placeholder="Type notes here...&#10;&#10;Lines starting with - or * become bullets"></textarea>
      <div class="action-row" style="margin-top: 8px;">
        <button class="send-btn" id="notes-show" style="flex:1;">Show on Portal</button>
        <button class="action-btn" id="notes-hide">Hide</button>
      </div>
    </div>

    <!-- Alarm -->
    <div class="section">
      <div class="section-label">Alarm</div>
      <div class="alarm-set-row">
        <input type="time" class="time-input" id="alarm-time" value="07:00">
        <button class="send-btn" id="alarm-set">Set Alarm</button>
      </div>
      <div class="alarm-list" id="alarm-list"></div>
    </div>

    <!-- YouTube -->
    <div class="section">
      <div class="section-label">YouTube</div>
      <div class="url-input-group">
        <input type="url" class="url-input" id="youtube-url" placeholder="Paste video or playlist URL...">
        <button class="send-btn" id="youtube-send">Play</button>
      </div>
      <div class="youtube-controls hidden" id="youtube-controls">
        <div class="action-row" style="margin-top: 8px;">
          <button class="action-btn" id="yt-stop">Stop</button>
        </div>
      </div>
    </div>

    <!-- Recipes -->
    <div class="section" id="recipes-section" style="display:none;">
      <div class="section-label">Recipes</div>
      <div class="recipe-list" id="recipe-list">
        <div style="color: var(--text-muted); font-size: 0.8rem;">Loading recipes...</div>
      </div>
      <button class="action-btn" id="recipe-close" style="margin-top: 8px; display: none;">Close Recipe</button>
    </div>

    <!-- Quick Actions -->
    <div class="section">
      <div class="section-label">Actions</div>
      <div class="action-row">
        <button class="action-btn" id="btn-refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
            <path d="M1 4v6h6M23 20v-6h-6"/>
            <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
          </svg>
          Refresh
        </button>
        <button class="action-btn" id="btn-sleep">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
          Sleep
        </button>
        <button class="action-btn" id="btn-wake">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          Wake
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    (function () {
      var statusDot = document.getElementById("status-dot");
      var statusText = document.getElementById("status-text");
      var db = null;

      try {
        if (!CONFIG.firebase || !CONFIG.firebase.apiKey) {
          throw new Error("Firebase not configured");
        }
        firebase.initializeApp(CONFIG.firebase);
        db = firebase.database();

        // Connection status
        db.ref(".info/connected").on("value", function (snap) {
          if (snap.val() === true) {
            statusDot.classList.add("connected");
            statusText.textContent = "Connected";
          } else {
            statusDot.classList.remove("connected");
            statusText.textContent = "Reconnecting...";
          }
        });

        // Listen for current state to sync button highlights
        db.ref("portal/command").on("value", function (snap) {
          var cmd = snap.val();
          if (!cmd) return;
          syncUI(cmd);
        });

      } catch (err) {
        statusText.textContent = "Firebase not configured — check config.js";
        console.error(err);
      }

      // ── Send Command ───────────────────────────────────
      function sendCommand(command) {
        if (!db) {
          showToast("Firebase not connected");
          return;
        }
        command.timestamp = Date.now();
        db.ref("portal/command").set(command);
      }

      // ── Sync UI with current state ─────────────────────
      function syncUI(cmd) {
        var btns = document.querySelectorAll(".widget-btn");
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
        document.getElementById("btn-showall").classList.remove("active");

        if (cmd.action === "show-widget") {
          var btn = document.getElementById("btn-" + cmd.widget);
          if (btn) btn.classList.add("active");
        } else if (cmd.action === "show-all") {
          document.getElementById("btn-showall").classList.add("active");
        }
      }

      // ── Widget Buttons ─────────────────────────────────
      var widgetBtns = document.querySelectorAll(".widget-btn");
      for (var i = 0; i < widgetBtns.length; i++) {
        (function (btn) {
          btn.addEventListener("click", function () {
            var widget = btn.getAttribute("data-widget");
            sendCommand({ action: "show-widget", widget: widget });
            showToast("Showing " + btn.textContent.trim());
          });
        })(widgetBtns[i]);
      }

      document.getElementById("btn-showall").addEventListener("click", function () {
        sendCommand({ action: "show-all" });
        showToast("Showing all widgets");
      });

      // ── Notes ──────────────────────────────────────────
      var notesInput = document.getElementById("notes-input");
      var currentColor = "white";

      // Color swatches
      var swatches = document.querySelectorAll(".color-swatch");
      for (var si = 0; si < swatches.length; si++) {
        (function (swatch) {
          swatch.addEventListener("click", function () {
            for (var sj = 0; sj < swatches.length; sj++) swatches[sj].classList.remove("selected");
            swatch.classList.add("selected");
            currentColor = swatch.getAttribute("data-color");
          });
        })(swatches[si]);
      }

      // Bullet button - insert "- " at cursor
      document.getElementById("notes-bullet").addEventListener("click", function () {
        var start = notesInput.selectionStart;
        var val = notesInput.value;
        var before = val.substring(0, start);
        var after = val.substring(start);
        // Find start of current line
        var lineStart = before.lastIndexOf("\n") + 1;
        var linePrefix = before.substring(lineStart);
        if (linePrefix.trim() === "") {
          // Empty line, add bullet
          notesInput.value = before + "- " + after;
          notesInput.selectionStart = notesInput.selectionEnd = start + 2;
        } else {
          // Add new bullet line
          notesInput.value = before + "\n- " + after;
          notesInput.selectionStart = notesInput.selectionEnd = start + 3;
        }
        notesInput.focus();
      });

      function textToHtml(text, color) {
        var lines = text.split("\n");
        var html = "";
        var inList = false;
        var colorClass = color !== "white" ? ' class="color-' + color + '"' : "";

        for (var li = 0; li < lines.length; li++) {
          var line = lines[li].trim();
          if (!line) {
            if (inList) { html += "</ul>"; inList = false; }
            continue;
          }
          if (line.charAt(0) === "-" || line.charAt(0) === "*") {
            if (!inList) { html += "<ul>"; inList = true; }
            html += "<li" + colorClass + ">" + escapeHtml(line.substring(1).trim()) + "</li>";
          } else {
            if (inList) { html += "</ul>"; inList = false; }
            html += "<p" + colorClass + ">" + escapeHtml(line) + "</p>";
          }
        }
        if (inList) html += "</ul>";
        return html;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      // Load saved notes from Firebase
      db.ref("portal/notes").on("value", function (snap) {
        var data = snap.val();
        if (data && data.text && !notesInput.value) {
          notesInput.value = data.text;
          if (data.color) currentColor = data.color;
        }
      }, function () {});

      document.getElementById("notes-show").addEventListener("click", function () {
        var text = notesInput.value.trim();
        if (!text) {
          showToast("Type something first");
          return;
        }
        var html = textToHtml(text, currentColor);
        db.ref("portal/notes").set({
          text: text,
          html: html,
          color: currentColor,
          visible: true,
          timestamp: Date.now()
        });
        showToast("Notes displayed on Portal");
      });

      document.getElementById("notes-hide").addEventListener("click", function () {
        db.ref("portal/notes/visible").set(false);
        showToast("Notes hidden");
      });

      // ── Alarms ─────────────────────────────────────────
      function renderAlarms(alarms) {
        var list = document.getElementById("alarm-list");
        list.innerHTML = "";
        if (!alarms) return;
        var keys = Object.keys(alarms);
        for (var i = 0; i < keys.length; i++) {
          var alarm = alarms[keys[i]];
          if (!alarm) continue;
          var h = alarm.hour;
          var ampm = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
          var m = alarm.minute.toString();
          if (m.length < 2) m = "0" + m;
          var div = document.createElement("div");
          div.className = "alarm-item";
          div.innerHTML = '<span class="alarm-item-time">' + h + ":" + m + " " + ampm +
            (alarm.fired ? " (done)" : "") +
            '</span><button class="alarm-delete" data-key="' + keys[i] + '">Delete</button>';
          list.appendChild(div);
        }

        var delBtns = list.querySelectorAll(".alarm-delete");
        for (var j = 0; j < delBtns.length; j++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              db.ref("portal/alarms/" + btn.getAttribute("data-key")).remove();
              showToast("Alarm deleted");
            });
          })(delBtns[j]);
        }
      }

      // Listen for alarm changes
      db.ref("portal/alarms").on("value", function (snap) {
        renderAlarms(snap.val());
      }, function (err) {
        console.error("Alarm read error:", err);
      });

      document.getElementById("alarm-set").addEventListener("click", function () {
        var timeInput = document.getElementById("alarm-time");
        var parts = timeInput.value.split(":");
        if (parts.length !== 2) return;
        var hour = parseInt(parts[0], 10);
        var minute = parseInt(parts[1], 10);

        var key = db.ref("portal/alarms").push().key;
        db.ref("portal/alarms/" + key).set({
          hour: hour,
          minute: minute,
          fired: false
        });

        var h = hour % 12 || 12;
        var ampm = hour >= 12 ? "PM" : "AM";
        var m = minute.toString();
        if (m.length < 2) m = "0" + m;
        showToast("Alarm set for " + h + ":" + m + " " + ampm);
      });

      // ── YouTube ────────────────────────────────────────
      var ytControls = document.getElementById("youtube-controls");

      document.getElementById("youtube-send").addEventListener("click", function () {
        var input = document.getElementById("youtube-url");
        var url = input.value.trim();
        if (!url) return;

        var videoId = null;
        var listId = null;

        try {
          var parsed = new URL(url);
          // Check for playlist
          if (parsed.searchParams.has("list")) {
            listId = parsed.searchParams.get("list");
          }
          // Also grab video ID if present
          if (parsed.hostname.indexOf("youtu.be") !== -1) {
            videoId = parsed.pathname.slice(1);
          } else if (parsed.pathname.indexOf("/shorts/") !== -1) {
            videoId = parsed.pathname.split("/shorts/")[1].split(/[/?]/)[0];
          } else if (parsed.searchParams.has("v")) {
            videoId = parsed.searchParams.get("v");
          } else if (parsed.pathname.indexOf("/playlist") !== -1 && listId) {
            // Pure playlist URL, no video ID needed
            videoId = null;
          }
        } catch (e) {
          if (/^[\w-]{11}$/.test(url)) videoId = url;
        }

        if (!videoId && !listId) {
          showToast("Invalid YouTube URL");
          return;
        }

        if (listId) {
          sendCommand({ action: "play-youtube-playlist", listId: listId, videoId: videoId });
          showToast("Playing playlist...");
        } else {
          sendCommand({ action: "play-youtube", videoId: videoId });
          showToast("Sending to Portal...");
        }
        ytControls.classList.remove("hidden");
        input.value = "";
      });

      document.getElementById("yt-stop").addEventListener("click", function () {
        sendCommand({ action: "stop-youtube" });
        ytControls.classList.add("hidden");
        showToast("YouTube stopped");
      });

      // ── Recipes ─────────────────────────────────────────
      var recipesSection = document.getElementById("recipes-section");
      var recipeList = document.getElementById("recipe-list");
      var recipeCloseBtn = document.getElementById("recipe-close");

      if (CONFIG.recipesApiUrl) {
        recipesSection.style.display = "";
        fetch(CONFIG.recipesApiUrl)
          .then(function (res) { return res.json(); })
          .then(function (recipes) {
            recipeList.innerHTML = "";
            for (var i = 0; i < recipes.length; i++) {
              (function (recipe) {
                var btn = document.createElement("button");
                btn.className = "recipe-item";
                btn.textContent = recipe.name;
                btn.addEventListener("click", function () {
                  sendCommand({ action: "show-recipe", url: CONFIG.recipesApiUrl + "?id=" + recipe.id });
                  recipeCloseBtn.style.display = "";
                  showToast("Showing " + recipe.name);
                });
                recipeList.appendChild(btn);
              })(recipes[i]);
            }
          })
          .catch(function () {
            recipeList.innerHTML = '<div style="color: var(--red); font-size: 0.8rem;">Failed to load recipes</div>';
          });
      }

      recipeCloseBtn.addEventListener("click", function () {
        sendCommand({ action: "hide-recipe" });
        recipeCloseBtn.style.display = "none";
        showToast("Recipe closed");
      });

      // ── Quick Actions ──────────────────────────────────
      document.getElementById("btn-refresh").addEventListener("click", function () {
        sendCommand({ action: "refresh" });
        showToast("Refreshing Portal...");
      });

      document.getElementById("btn-sleep").addEventListener("click", function () {
        sendCommand({ action: "sleep" });
        showToast("Portal sleeping");
      });

      document.getElementById("btn-wake").addEventListener("click", function () {
        sendCommand({ action: "wake" });
        showToast("Waking Portal");
      });

      // ── Toast ──────────────────────────────────────────
      var toastTimeout;
      function showToast(msg) {
        var toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function () { toast.classList.remove("show"); }, 2000);
      }
    })();
  </script>
</body>
</html>
